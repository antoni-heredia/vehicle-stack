services:
  # ---------------- Kafka (modo KRaft) ----------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CLUSTER_ID: nkjTFwV8Tn-KraFtClusterId   
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - kafka
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:9092
      - SCHEMA_REGISTRY_KAFKASTORE_TOPIC=_schemas
    ports:
      - "8081:8081"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vehicle-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081


  # ---------------- OSRM servidor de rutas ----------------
  osrm:
    image: osrm/osrm-backend:latest
    container_name: osrm
    command: osrm-routed --algorithm mld /data/spain-latest.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
  # ---------------- Overpass API ----------------
  overpass:
    image: wiktorn/overpass-api
    container_name: overpass
    ports:
      - "8083:80"
    environment:
      - OVERPASS_META=yes
      - OVERPASS_MODE=init
      - OVERPASS_PLANET_URL=https://download.geofabrik.de/europe/spain-latest.osm.pbf
    volumes:
      - ./overpass-db:/db




  # ---------------- Simulador de vehículos ----------------
  vehicle-data-simulator:
    build: ./vehicle-data-simulator
    container_name: vehicle-data-simulator
    environment:
      - KAFKA_BROKER=kafka:9092
      - KAFKA_TOPIC=vehicle-data
      - OSRM_URL=http://osrm:5000
      - OVERPASS_URL=https://overpass-api.de/api/interpreter
    depends_on:
      - kafka
      - osrm

  # ---------------- ClickHouse ----------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      #- ./clickhouse-data:/var/lib/clickhouse # uncomment to persist data
      - ./vehicle-warehouse/ddl:/docker-entrypoint-initdb.d
      - ./clickhouse-config/users.d/default.xml:/etc/clickhouse-server/users.d/default.xml:ro

  clickhouse-ui:
    image: spoonest/clickhouse-tabix-web-client
    container_name: clickhouse-ui
    environment:
      - CH_NAME=ClickHouse
      - CH_HOST=localhost
      - CH_PORT=8123
      - CH_LOGIN=default
      - CH_PASSWORD=
      - CH_DB=default
    ports:
      - "8124:80"
    depends_on:
      - clickhouse
    restart: unless-stopped


  # ---------------- Grafana ----------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - clickhouse
  # -------------- Kafka Init --------------
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: >
      sh -c "
        echo 'Esperando Kafka...';
        sleep 5;
        bash /scripts/create-topics.sh;
        echo 'Inicialización completada.';
      "
    volumes:
      - ./scripts:/scripts
      - ./avro:/avro
    restart: "no"
  kafka-schema-init:
    image: debian:bookworm-slim
    container_name: kafka-schema-init
    depends_on:
      - kafka
      - schema-registry
    volumes:
      - ./scripts:/scripts
      - ./avro:/avro
    working_dir: /scripts
    entrypoint: >
      bash -c "
        apt update -qq &&
        apt install -y -qq curl jq netcat-openbsd > /dev/null &&
        echo 'Esperando a que Kafka y Schema Registry estén disponibles...';
        until nc -z kafka 9092; do sleep 5; done;
        until nc -z schema-registry 8081; do sleep 5; done;
        bash /scripts/create-schemas.sh;
        echo 'Inicialización completada.';
      "
    restart: "no"
